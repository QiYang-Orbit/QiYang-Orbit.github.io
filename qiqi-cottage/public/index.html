<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff0f7"><meta name="description" content="QiQi和好朋友们的小屋，收藏想吃的，等下次见面一起安排。"><title>QiQi的小屋</title>
<link rel="icon" href="assets/cottage-icon.png"><link rel="apple-touch-icon" href="assets/cottage-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=1"><script src="app.js?v=1" type="module"></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳到菜单 / Skip to menu</a>
<div class="site-shell">
<header class="masthead"><a class="wordmark" href="#menu" aria-label="QiQi的小屋"><span class="wordmark-en">QiQi</span><span class="wordmark-cn" data-i18n="cottage">的小屋</span></a><button class="profile-trigger" id="profile-trigger" aria-label="我的名片"><span id="header-avatar" class="avatar avatar-header">☺</span><span id="header-name" data-i18n="myCard">我的名片</span></button></header>
<div class="hero"><img src="assets/qiqi-cottage-soft.png" width="500" height="333" alt="粉色屋顶、浅蓝窗框的水彩小屋" fetchpriority="high" id="hero-image"></div>
<nav class="section-nav" aria-label="Main navigation"><button class="section-tab active" data-tab="menu" data-i18n="cabinet">投喂柜</button><button class="section-tab" data-tab="wishes"><span data-i18n="myWishes">我的心愿</span><span class="count-badge" id="wish-count" hidden>0</span></button><button class="section-tab" data-tab="owner" id="owner-tab" hidden data-i18n="ownerNotebook">QiQi手账</button></nav>
<div id="connection-notice" class="connection-notice" role="status" hidden></div>
<main id="main-content" tabindex="-1"><section id="menu-panel"><div class="category-list" id="categories" role="group" aria-label="Categories"></div><div class="section-heading"><h1 data-i18n="menuHeading">菜单</h1><span id="menu-count" class="muted"></span></div><div class="food-grid" id="food-grid" aria-live="polite"></div></section><section id="wishes-panel" hidden></section><section id="owner-panel" hidden></section></main>
<footer><button class="subtle-button" id="privacy-trigger" data-i18n="privacy">隐私说明</button><span class="footer-dot">·</span><button class="subtle-button" id="settings-trigger" data-i18n="settings">设置</button></footer>
</div>
<nav class="bottom-nav" aria-label="Mobile navigation"><button data-tab="menu" class="bottom-button active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18v10H3zM2 4h20v6H2zM9 14h6"/></svg><span data-i18n="cabinet">投喂柜</span></button><button data-tab="wishes" class="bottom-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg><span data-i18n="myWishes">我的心愿</span></button><button class="bottom-button" id="bottom-profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span data-i18n="me">我的</span></button></nav>
<dialog id="card-dialog" class="sheet-dialog"><form id="card-form"><div class="dialog-heading"><h2 data-i18n="myCard">我的名片</h2><button type="button" class="icon-button dialog-close" data-close="card-dialog" aria-label="Close">×</button></div><div id="signed-out-card"><p class="muted" data-i18n="cardHint">填一个QiQi认得出的名字，让心愿有个署名。</p><div class="auth-tabs"><button type="button" class="auth-tab active" data-auth="login" data-i18n="login">登录</button><button type="button" class="auth-tab" data-auth="signup" data-i18n="signup">第一次来</button></div><label><span data-i18n="username">登录名</span><input id="auth-username" name="username" autocomplete="username" inputmode="text" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" placeholder="e.g. littlemoon"></label><label><span data-i18n="password">密码</span><input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128"><small data-i18n="passwordHint">至少10个字符。请勿使用微信或其他账号的密码。</small></label><div id="signup-fields" hidden><label><span data-i18n="nickname">QiQi认得出的名字</span><input id="signup-name" name="nickname" autocomplete="nickname" maxlength="24"></label><label><span data-i18n="inviteCode">朋友邀请码</span><input id="invite-code" name="invite" autocomplete="off" maxlength="100"></label><details><summary data-i18n="ownerSetup">QiQi首次设置</summary><label><span data-i18n="ownerCode">QiQi设置码</span><input id="owner-code" type="password" autocomplete="off" maxlength="100"></label></details><label class="checkbox-row"><input id="signup-consent" type="checkbox"><span data-i18n="consent">同意保存名片和心愿，供我和QiQi查看</span></label></div><button type="submit" class="primary-button full-width" id="auth-submit" data-i18n="login">登录</button></div><div id="signed-in-card" hidden><div class="avatar-editor"><label class="avatar avatar-large" for="avatar-input" id="profile-avatar">☺</label><div><label class="text-link" for="avatar-input" data-i18n="chooseAvatar">选择头像（选填）</label><button class="subtle-button" type="button" id="remove-avatar" data-i18n="removeAvatar">移除头像</button></div><input id="avatar-input" type="file" accept="image/png,image/jpeg" hidden></div><label><span data-i18n="nickname">QiQi认得出的名字</span><input id="profile-name" name="profileName" autocomplete="nickname" maxlength="24"></label><label><span data-i18n="allergies">忌口（选填）</span><textarea id="profile-allergies" maxlength="200" rows="2"></textarea></label><button type="submit" class="primary-button full-width" data-i18n="saveCard">保存名片</button><button type="button" id="card-wishes" class="secondary-button full-width" data-i18n="viewWishes">查看我的心愿单</button></div><div class="settings-section"><label class="language-label"><span data-i18n="language">语言 / Language</span><select id="language-select" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select></label><p class="tiny" data-i18n="profilePrivacy">名片、忌口和心愿仅你与QiQi可见。</p><button type="button" id="logout-button" class="subtle-button" hidden data-i18n="logout">退出登录</button></div><p id="card-error" class="form-error" role="alert"></p></form></dialog>
<dialog id="request-dialog" class="sheet-dialog"><form id="request-form"><div class="dialog-heading"><h2 data-i18n="newWish">许个新愿望</h2><button type="button" class="icon-button dialog-close" data-close="request-dialog" aria-label="Close">×</button></div><label><span data-i18n="wishTitle">你想吃什么</span><input id="request-title" maxlength="40" required></label><label><span data-i18n="wishNote">顺便说两句（选填）</span><textarea id="request-note" maxlength="200" rows="3"></textarea></label><button class="primary-button full-width" type="submit" data-i18n="sendWish">让QiQi看到我的心愿</button><p id="request-error" class="form-error" role="alert"></p></form></dialog>
<dialog id="privacy-dialog" class="sheet-dialog"><div class="dialog-heading"><h2 data-i18n="privacy">隐私说明</h2><button class="icon-button dialog-close" data-close="privacy-dialog" aria-label="Close">×</button></div><p class="privacy-copy" data-i18n="privacyBody">我们保存你的登录名、加密处理的密码、昵称、主动上传的头像、忌口、心愿和冰块偏好，用于朋友间分享食物。其他朋友看不到你的名片和心愿。头像和忌口选填。需要更正或删除个人资料时，请联系QiQi。本站不收款，不提供配送服务。</p></dialog>
<dialog id="food-dialog" class="sheet-dialog"><form id="food-form"><div class="dialog-heading"><h2 data-i18n="editFood">编辑菜单</h2><button type="button" class="icon-button dialog-close" data-close="food-dialog" aria-label="Close">×</button></div><input type="hidden" id="edit-id"><label><span data-i18n="nameZh">中文名称</span><input id="edit-name-zh" required maxlength="40"></label><label><span data-i18n="nameEn">English name</span><input id="edit-name-en" required maxlength="80"></label><label><span data-i18n="descriptionZh">中文介绍</span><textarea id="edit-desc-zh" rows="2" maxlength="250"></textarea></label><label><span data-i18n="descriptionEn">English description</span><textarea id="edit-desc-en" rows="2" maxlength="350"></textarea></label><label><span data-i18n="category">分类</span><select id="edit-category"><option value="drinks" data-i18n="drinks">开心甜甜水</option><option value="desserts" data-i18n="desserts">小甜点</option><option value="meals" data-i18n="meals">好吃的饭饭</option></select></label><label class="checkbox-row"><input type="checkbox" id="edit-active"><span data-i18n="showFood">在菜单中展示</span></label><label class="checkbox-row"><input type="checkbox" id="edit-ice"><span data-i18n="allowIce">允许选择冰块偏好</span></label><button type="submit" class="primary-button full-width" data-i18n="saveFood">保存菜品</button><p id="food-error" class="form-error" role="alert"></p></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
